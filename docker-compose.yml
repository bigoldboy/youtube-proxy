services:
  youtube-proxy:
    image: ghcr.io/bigoldboy/youtube-proxy:latest
    # build: .   # use this instead to build locally
    container_name: youtube-proxy
    ports:
      - "6095:6095"
    volumes:
      # Folder holding cookies.txt exported from a signed-in browser (see README).
      - ./cookies:/cookies:ro
    restart: unless-stopped
